<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Craveh</title>
  <link rel="stylesheet" href="admin-app.css">
  <link rel="icon" href="../assets/images/tabicon.png" type="image/png">

</head>
<body>

<header class="admin-topnav">
  <a href="admin-dashboard.html" class="admin-logo">
    <div class="admin-logo-icon">
      <img src="../assets/images/craveh(1).png" alt="craveh" style="width:36px;height:36psx;display:block;">    
    </div>
    <span class="admin-logo-name">craveh</span>
    <span class="admin-logo-badge">Admin</span>
  </a>
  <div class="admin-nav-right">
    <span class="admin-nav-welcome" id="adminName"></span>
    <a href="admin-profile.html" class="admin-nav-btn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      Profile
    </a>
    <button onclick="adminLogout()" class="admin-nav-btn logout">Logout</button>
  </div>
</header>

<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-sidebar-section">
      <span class="admin-sidebar-label">Navigation</span>
      <a href="admin-dashboard.html" class="admin-sidebar-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="admin-orders.html" class="admin-sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>
        Orders
      </a>
      <a href="admin-menu.html" class="admin-sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 100 20A10 10 0 0012 2z"/><path d="M12 6v6l4 2"/></svg>
        Menu
      </a>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-page-header">
      <div>
        <h1 class="admin-page-title">Dashboard</h1>
        <p class="admin-page-subtitle">Welcome back — here's what's happening today.</p>
      </div>
    </div>

    <div id="errorContainer"></div>

    <div class="admin-stats-row">
      <div class="admin-stat-card revenue">
        <div class="admin-stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
        </div>
        <div class="admin-stat-label">Today's Revenue</div>
        <div class="admin-stat-value" id="todayRevenue">$0.00</div>
      </div>
      <div class="admin-stat-card pending">
        <div class="admin-stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <div class="admin-stat-label">Pending Orders</div>
        <div class="admin-stat-value" id="pendingOrders">0</div>
      </div>
      <div class="admin-stat-card today">
        <div class="admin-stat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>
        </div>
        <div class="admin-stat-label">Orders Today</div>
        <div class="admin-stat-value" id="totalOrdersToday">0</div>
      </div>
    </div><!-- /.admin-stats-row -->

    <div class="admin-table-card">
      <div class="admin-table-header">
        <span class="admin-table-title">Recent Orders</span>
        <a href="admin-orders.html" class="admin-view-all">View all →</a>
      </div>
      <div id="recentOrdersContainer" class="admin-loading-state">Loading orders…</div>
    </div>
  </main>
</div>

<script>
  document.addEventListener('DOMContentLoaded', async () => {
    await loadAdminSession();
    await loadDashboardStats();
  });

  async function loadAdminSession() {
    try {
      const r = await fetch('admin-session.php');
      const d = await r.json();
      if (d.success && d.admin) {
        document.getElementById('adminName').textContent = `Hi, ${d.admin.name}`;
      } else { window.location.href = 'admin-login.html'; }
    } catch { window.location.href = 'admin-login.html'; }
  }

  async function loadDashboardStats() {
    try {
      const r = await fetch('admin-api.php?action=get_stats');
      const d = await r.json();
      if (d.success) {
        document.getElementById('todayRevenue').textContent = '$' + parseFloat(d.todayRevenue).toFixed(2);
        document.getElementById('pendingOrders').textContent = d.pendingOrders;
        document.getElementById('totalOrdersToday').textContent = d.totalOrdersToday;
        renderRecentOrders(d.recentOrders);
      }
    } catch { showError('Failed to load dashboard stats'); }
  }

  function renderRecentOrders(orders) {
    const c = document.getElementById('recentOrdersContainer');
    if (!orders || orders.length === 0) {
      c.innerHTML = '<div class="admin-empty-state">No orders yet</div>'; return;
    }
    let html = `<table><thead><tr><th>Order</th><th>Amount</th><th>Status</th><th>Time</th></tr></thead><tbody>`;
    orders.forEach(order => {
      const time = new Date(order.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      html += `<tr>
        <td><span class="admin-order-num">#${order.id}</span></td>
        <td>$${parseFloat(order.total_amount).toFixed(2)}</td>
        <td><span class="badge badge-${order.status}">${fmt(order.status)}</span></td>
        <td>${time}</td>
      </tr>`;
    });
    html += '</tbody></table>';
    c.innerHTML = html;
  }

  function fmt(s) { return String(s||'').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()); }

  function showError(msg) {
    const c = document.getElementById('errorContainer');
    c.innerHTML = `<div class="admin-msg admin-msg-error">${msg}</div>`;
    setTimeout(() => c.innerHTML = '', 5000);
  }

  function adminLogout() {
    if (confirm('Are you sure you want to logout?'))
      fetch('admin-logout.php', {method:'POST'}).then(() => { window.location.href = 'admin-login.html'; });
  }

  setInterval(loadDashboardStats, 30000);
</script>
</body>
</html>
