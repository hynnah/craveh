<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Management - Craveh Admin</title>
  <link rel="stylesheet" href="admin-app.css">
  <link rel="icon" href="../assets/images/tabicon1.png" type="image/png">
</head>
<body>

<header class="admin-topnav">
  <a href="admin-dashboard.html" class="admin-logo">
    <div class="admin-logo-icon">
    <img src="../assets/images/craveh(1).png" alt="craveh" style="width:36px;height:36px;display:block;">    
    </div>
    <span class="admin-logo-name">craveh</span>
    <span class="admin-logo-badge">Admin</span>
  </a>
  <div class="admin-nav-right">
    <span class="admin-nav-welcome" id="adminName"></span>
    <a href="admin-profile.html" class="admin-nav-btn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      Profile
    </a>
    <button onclick="adminLogout()" class="admin-nav-btn logout">Logout</button>
  </div>
</header>

<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-sidebar-section">
      <span class="admin-sidebar-label">Navigation</span>
      <a href="admin-dashboard.html" class="admin-sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="admin-orders.html" class="admin-sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>
        Orders
      </a>
      <a href="admin-menu.html" class="admin-sidebar-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 100 20A10 10 0 0012 2z"/><path d="M12 6v6l4 2"/></svg>
        Menu
      </a>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-page-header">
      <div>
        <h1 class="admin-page-title">Menu</h1>
        <p class="admin-page-subtitle">Add, edit, and manage food items</p>
      </div>
      
    </div>

    <div id="messageContainer"></div>

    <!-- Filter Container -->
     <div class="admin-filter-bar">
      <div class="admin-filter-top-row"> <span class="admin-filter-label">Filter by Category:</span>
        <input type="text" id="adminMenuSearch" placeholder="Search items..." 
              oninput="searchMenu(this.value)" class="search-box">
        <button class="btn btn-primary" onclick="openAddModal()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Item
      </button>
      </div>

      <div class="admin-filter-pills" id="categoryFilters">
        <button class="admin-filter-pill active" onclick="filterMenu('All', this)">All</button>
        <button class="admin-filter-pill" onclick="filterMenu('Appetizers', this)">Appetizers</button>
        <button class="admin-filter-pill" onclick="filterMenu('Burgers', this)">Burgers</button>
        <button class="admin-filter-pill" onclick="filterMenu('Pizza', this)">Pizza</button>
        <button class="admin-filter-pill" onclick="filterMenu('Pasta', this)">Pasta</button>
        <button class="admin-filter-pill" onclick="filterMenu('Mexican', this)">Mexican</button>
        <button class="admin-filter-pill" onclick="filterMenu('BBQ', this)">BBQ</button>
        <button class="admin-filter-pill" onclick="filterMenu('Seafood', this)">Seafood</button>
        <button class="admin-filter-pill" onclick="filterMenu('Salads', this)">Salads</button>
        <button class="admin-filter-pill" onclick="filterMenu('Desserts', this)">Desserts</button>
        <button class="admin-filter-pill" onclick="filterMenu('Beverages', this)">Beverages</button>
      </div>
    </div>

    <div id="menuContainer" class="admin-menu-grid">
      <div class="admin-loading-state">Loading menu items…</div>
    </div>
  </main>
</div>

<!-- Add / Edit Modal -->
<div class="admin-modal-overlay" id="itemModal">
  <div class="admin-modal-box">
    <div class="admin-modal-head">
      <span class="admin-modal-title" id="modalTitle">Add New Item</span>
      <button class="admin-modal-close" onclick="closeModal()">✕</button>
    </div>
    <form class="admin-modal-body" id="itemForm" onsubmit="saveMenuItem(event)">
      <div class="admin-form-group">
        <label class="admin-form-label" for="itemName">Item Name <span class="required">*</span></label>
        <input class="admin-form-input" type="text" id="itemName" placeholder="e.g. Classic Burger" required>
      </div>
      <div class="admin-form-group">
        <label class="admin-form-label" for="itemDescription">Description</label>
        <textarea class="admin-form-input" id="itemDescription" rows="2" placeholder="Short description of the item"></textarea>
      </div>
      <div class="admin-form-row">
        <div class="admin-form-group">
          <label class="admin-form-label" for="itemPrice">Price (₱) <span class="required">*</span></label>
          <input class="admin-form-input" type="number" id="itemPrice" step="0.01" min="0" placeholder="0.00" required>
        </div>
        <div class="admin-form-group">
          <label class="admin-form-label" for="itemCategory">Category <span class="required">*</span></label>
          <select class="admin-form-input" id="itemCategory" required>
            <option value="">Select category…</option>
            <option value="Appetizers">Appetizers</option>
            <option value="Burgers">Burgers</option>
            <option value="Pizza">Pizza</option>
            <option value="Pasta">Pasta</option>
            <option value="Mexican">Mexican</option>
            <option value="BBQ">BBQ</option>
            <option value="Seafood">Seafood</option>
            <option value="Salads">Salads</option>
            <option value="Desserts">Desserts</option>
            <option value="Beverages">Beverages</option>
          </select>
        </div>
      </div>
      <div class="admin-form-group">
        <label class="admin-form-label">Image Source</label>
        <div class="admin-img-toggle">
          <button type="button" class="admin-toggle-opt active" id="toggleUrl" onclick="switchImageSource('url')">URL</button>
          <button type="button" class="admin-toggle-opt" id="toggleUpload" onclick="switchImageSource('upload')">Upload</button>
        </div>
        <div id="imageUrlField">
          <input class="admin-form-input" type="url" id="itemImageUrl" placeholder="https://example.com/image.jpg">
        </div>
        <div id="imageUploadField" style="display:none;">
          <input class="admin-form-input" type="file" id="itemImageFile" accept="image/*">
        </div>
        <img id="imagePreview" class="admin-img-preview" src="" alt="Preview">
      </div>
      <div class="admin-form-group">
        <label class="admin-check-row">
          <input type="checkbox" id="itemAvailable" checked>
          <span class="admin-check-label">Available for ordering</span>
        </label>
      </div>
    </form>
    <div class="admin-modal-footer">
      <button type="submit" class="btn btn-primary" id="saveBtn" form="itemForm">Save Item</button>
      <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
  let currentAdmin = null;
  let editingItemId = null;
  let allMenuItems = []; // <--- ADDED THIS FOR FILTERING
  let imageSource = 'url';
  let uploadedImageUrl = '';

  document.addEventListener('DOMContentLoaded', async () => {
    await loadAdminSession();
    await loadMenuItems();
  });

  async function loadAdminSession() {
    try {
      const r = await fetch('admin-session.php');
      const d = await r.json();
      if (d.success && d.admin) {
        currentAdmin = d.admin;
        document.getElementById('adminName').textContent = `Hi, ${d.admin.name}`;
      } else { window.location.href = 'admin-login.html'; }
    } catch { window.location.href = 'admin-login.html'; }
  }

  async function loadMenuItems() {
    try {
      const r = await fetch('admin-api.php?action=get_menu_items');
      const d = await r.json();
      if (d.success) { 
        allMenuItems = d.items; // Save the full list here
        renderMenuItems(allMenuItems); // Pass the list to the render function
      }
      else { showMessage('Failed to load menu items', 'error'); }
    } catch { showMessage('Error loading menu items', 'error'); }
  }

  function filterMenu(category, element) {
    // 1. Update UI: Toggle 'active' class on the filter buttons
    const pills = document.querySelectorAll('.admin-filter-pill');
    pills.forEach(p => p.classList.remove('active'));
    element.classList.add('active');

    // 2. Filter the saved items
    if (category === 'All') {
      renderMenuItems(allMenuItems);
    } else {
      const filtered = allMenuItems.filter(item => item.category === category);
      renderMenuItems(filtered);
    }
  }

  function searchMenu(query) {
    const searchTerm = query.toLowerCase();
    const filtered = allMenuItems.filter(item =>
      item.name.toLowerCase().includes(searchTerm) ||
      (item.description || '').toLowerCase().includes(searchTerm)
    );
    renderMenuItems(filtered);
  }

  function renderMenuItems(items) {
    const container = document.getElementById('menuContainer');
    if (!items || items.length === 0) {
      container.innerHTML = '<div class="admin-empty-state">No menu items yet — add your first item!</div>';
      return;
    }
    let html = '';
    items.forEach(item => {
      const avail = parseInt(item.is_available, 10) === 1;
      html += `<div class="admin-menu-card">
        <div class="admin-menu-img-wrap">
          <img src="${item.image_url || ''}" alt="${item.name}" class="admin-menu-img" onerror="this.src='https://via.placeholder.com/300x180?text=No+Image'">
          <span class="admin-menu-cat-badge">${item.category}</span>
        </div>
        <div class="admin-menu-body">
          <div class="admin-menu-name">${item.name}</div>
          <div class="admin-menu-desc">${item.description || 'No description'}</div>
          <div class="admin-menu-footer">
            <span class="admin-menu-price">₱${parseFloat(item.price).toFixed(2)}</span>
            <span class="admin-avail-pill ${avail ? 'avail-yes' : 'avail-no'}">${avail ? 'Available' : 'Unavailable'}</span>
          </div>
          <div class="admin-menu-actions">
            <button class="admin-action-btn admin-edit-btn" onclick="openEditModal(${item.id})">Edit</button>
            <button class="admin-action-btn admin-del-btn" onclick="deleteMenuItem(${item.id})">Delete</button>
          </div>
        </div>
      </div>`;
    });
    container.innerHTML = html;
  }

  function openAddModal() {
    editingItemId = null;
    uploadedImageUrl = '';
    document.getElementById('modalTitle').textContent = 'Add New Item';
    document.getElementById('itemForm').reset();
    document.getElementById('itemAvailable').checked = true;
    document.getElementById('imagePreview').style.display = 'none';
    switchImageSource('url');
    document.getElementById('itemModal').classList.add('show');
  }

  async function openEditModal(itemId) {
    try {
      const r = await fetch(`admin-api.php?action=get_menu_item&id=${itemId}`);
      const d = await r.json();
      if (d.success) {
        const item = d.item;
        editingItemId = itemId;
        document.getElementById('modalTitle').textContent = 'Edit Item';
        document.getElementById('itemName').value = item.name;
        document.getElementById('itemDescription').value = item.description || '';
        document.getElementById('itemPrice').value = item.price;
        document.getElementById('itemCategory').value = item.category;
        uploadedImageUrl = item.image_url || '';
        const isUrl = !item.image_url || item.image_url.startsWith('http');
        switchImageSource(isUrl ? 'url' : 'upload');
        document.getElementById('itemImageUrl').value = isUrl ? (item.image_url || '') : '';
        document.getElementById('itemAvailable').checked = parseInt(item.is_available, 10) === 1;
        const preview = document.getElementById('imagePreview');
        if (item.image_url) { preview.src = item.image_url; preview.style.display = 'block'; }
        else { preview.style.display = 'none'; }
        document.getElementById('itemModal').classList.add('show');
      } else { showMessage('Failed to load item', 'error'); }
    } catch { showMessage('Error loading item', 'error'); }
  }

  function closeModal() {
    document.getElementById('itemModal').classList.remove('show');
    editingItemId = null;
  }

  function switchImageSource(source) {
    imageSource = source;
    document.getElementById('toggleUrl').classList.toggle('active', source === 'url');
    document.getElementById('toggleUpload').classList.toggle('active', source === 'upload');
    document.getElementById('imageUrlField').style.display = source === 'url' ? '' : 'none';
    document.getElementById('imageUploadField').style.display = source === 'upload' ? '' : 'none';
  }

  document.getElementById('itemImageUrl').addEventListener('input', e => {
    const p = document.getElementById('imagePreview');
    if (e.target.value) { p.src = e.target.value; p.style.display = 'block'; }
    else { p.style.display = 'none'; }
  });

  document.getElementById('itemImageFile').addEventListener('change', e => {
    const f = e.target.files[0];
    const p = document.getElementById('imagePreview');
    if (f) { p.src = URL.createObjectURL(f); p.style.display = 'block'; }
    else { p.style.display = 'none'; }
  });

  async function saveMenuItem(e) {
    e.preventDefault();
    let imageUrl = '';
    if (imageSource === 'url') {
      imageUrl = document.getElementById('itemImageUrl').value;
    } else {
      const fileInput = document.getElementById('itemImageFile');
      if (fileInput.files[0]) {
        const formData = new FormData();
        formData.append('image', fileInput.files[0]);
        try {
          const ur = await fetch('admin-api.php?action=upload_image', { method: 'POST', body: formData });
          const ud = await ur.json();
          if (ud.success) { imageUrl = ud.url; }
          else { showMessage(ud.error || 'Image upload failed', 'error'); return; }
        } catch { showMessage('Image upload failed', 'error'); return; }
      } else if (editingItemId) { imageUrl = uploadedImageUrl; }
    }

    const itemData = {
      name: document.getElementById('itemName').value,
      description: document.getElementById('itemDescription').value,
      price: parseFloat(document.getElementById('itemPrice').value),
      category: document.getElementById('itemCategory').value,
      image_url: imageUrl,
      is_available: document.getElementById('itemAvailable').checked ? 1 : 0
    };

    if (!itemData.name || !itemData.price || !itemData.category) {
      showMessage('Please fill in all required fields', 'error'); return;
    }

    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="admin-spinner"></span> Saving…';

    try {
      let url = editingItemId ? 'admin-api.php?action=update_menu_item' : 'admin-api.php?action=add_menu_item';
      if (editingItemId) itemData.id = editingItemId;
      const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(itemData) });
      const d = await r.json();
      if (d.success) {
        showMessage(editingItemId ? 'Item updated!' : 'Item added!', 'success');
        closeModal();
        await loadMenuItems();
      } else { showMessage(d.error || 'Failed to save item', 'error'); }
    } catch { showMessage('Error saving item', 'error'); }
    finally { btn.disabled = false; btn.innerHTML = 'Save Item'; }
  }

  async function deleteMenuItem(itemId) {
    if (!confirm('Delete this menu item?')) return;
    try {
      const r = await fetch('admin-api.php?action=delete_menu_item', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: itemId }) });
      const d = await r.json();
      if (d.success) { showMessage('Item deleted', 'success'); await loadMenuItems(); }
      else { showMessage('Failed to delete item', 'error'); }
    } catch { showMessage('Error deleting item', 'error'); }
  }

  function showMessage(msg, type) {
    const c = document.getElementById('messageContainer');
    c.innerHTML = `<div class="admin-msg admin-msg-${type}">${msg}</div>`;
    setTimeout(() => c.innerHTML = '', 5000);
  }

  function adminLogout() {
    if (confirm('Are you sure you want to logout?')) {
      fetch('admin-logout.php', { method: 'POST' }).then(() => { window.location.href = 'admin-login.html'; });
    }
  }

  document.getElementById('itemModal').addEventListener('click', e => {
    if (e.target === document.getElementById('itemModal')) closeModal();
  });
</script>
</body>
</html>
