<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders - Craveh Admin</title>
  <link rel="stylesheet" href="admin-app.css">
  <link rel="icon" href="../assets/images/tabicon1.png" type="image/png">
</head>
<body>

<header class="admin-topnav">
  <a href="admin-dashboard.html" class="admin-logo">
    <div class="admin-logo-icon">
      <img src="../assets/images/craveh(1).png" alt="craveh" style="width:36px;height:36px;display:block;">    
    </div>
    <span class="admin-logo-name">craveh</span>
    <span class="admin-logo-badge">Admin</span>
  </a>
  <div class="admin-nav-right">
    <span class="admin-nav-welcome" id="adminName"></span>
    <a href="admin-profile.html" class="admin-nav-btn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      Profile
    </a>
    <button onclick="adminLogout()" class="admin-nav-btn logout">Logout</button>
  </div>
</header>

<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-sidebar-section">
      <span class="admin-sidebar-label">Navigation</span>
      <a href="admin-dashboard.html" class="admin-sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="admin-orders.html" class="admin-sidebar-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>
        Orders
      </a>
      <a href="admin-menu.html" class="admin-sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 100 20A10 10 0 0012 2z"/><path d="M12 6v6l4 2"/></svg>
        Menu
      </a>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-page-header">
      <div>
        <h1 class="admin-page-title">Orders</h1>
        <p class="admin-page-subtitle">Manage and update customer orders</p>
      </div>
    </div>

    <div id="messageContainer"></div>

    <div class="admin-filter-bar">
      <span class="admin-filter-label">Filter:</span>
      <div class="admin-filter-pills">
        <button class="admin-filter-pill active" onclick="setFilter(this, '')">All</button>
        <button class="admin-filter-pill" onclick="setFilter(this, 'pending')">Pending</button>
        <button class="admin-filter-pill" onclick="setFilter(this, 'confirmed')">Confirmed</button>
        <button class="admin-filter-pill" onclick="setFilter(this, 'preparing')">Preparing</button>
        <button class="admin-filter-pill" onclick="setFilter(this, 'out_for_delivery')">Out for Delivery</button>
        <button class="admin-filter-pill" onclick="setFilter(this, 'delivered')">Delivered</button>
        <button class="admin-filter-pill" onclick="setFilter(this, 'cancelled')">Cancelled</button>
      </div>
      <select id="statusFilter"></select>
    </div>

    <div id="ordersContainer" class="admin-orders-grid">
      <div class="admin-loading-state">Loading orders…</div>
    </div>
  </main>
</div>

<script>
  let currentFilter = '';

  document.addEventListener('DOMContentLoaded', async () => {
    await loadAdminSession();
    await loadOrders();
  });

  function setFilter(btn, val) {
    document.querySelectorAll('.admin-filter-pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = val;
    loadOrders();
  }

  async function loadAdminSession() {
    try {
      const r = await fetch('admin-session.php');
      const d = await r.json();
      if (d.success && d.admin) {
        document.getElementById('adminName').textContent = `Hi, ${d.admin.name}`;
      } else { window.location.href = 'admin-login.html'; }
    } catch { window.location.href = 'admin-login.html'; }
  }

  async function loadOrders() {
    const url = 'admin-api.php?action=get_orders' + (currentFilter ? `&status=${currentFilter}` : '');
    try {
      const r = await fetch(url);
      const d = await r.json();
      if (d.success) { renderOrders(d.orders); }
      else { showMessage('Failed to load orders', 'error'); }
    } catch { showMessage('Error loading orders', 'error'); }
  }

  function renderOrders(orders) {
    const c = document.getElementById('ordersContainer');
    if (!orders || orders.length === 0) {
      c.innerHTML = '<div class="admin-empty-state">No orders found</div>'; return;
    }
    let html = '';
    orders.forEach(order => {
      const date = new Date(order.created_at);
      const dateStr = date.toLocaleDateString('en-US', {month:'short', day:'numeric'}) + ' · ' + date.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      let itemsHtml = '';
      if (Array.isArray(order.items)) {
        order.items.forEach(item => {
          itemsHtml += `<div class="admin-item-row">
            <span class="admin-item-name">${item.name || item.menuItemId} ×${item.quantity}</span>
            <span class="admin-item-price">₱${parseFloat(item.price).toFixed(2)}</span>
          </div>`;
        });
      }
      
      html += `<div class="admin-order-card">
        <div class="admin-order-top">
          <span class="admin-order-num">Order #${order.id}</span>
          <span class="badge badge-${order.status}">${fmt(order.status)}</span>
        </div>
        <div class="admin-order-body">
          <div class="admin-order-meta">
            <div class="admin-meta-row"><span class="admin-meta-key">Customer&nbsp;</span><span class="admin-meta-val">#${order.client_user_id}</span></div>
            <div class="admin-meta-row"><span class="admin-meta-key">Date&nbsp;</span><span class="admin-meta-val">${dateStr}</span></div>
            <div class="admin-meta-row" style="grid-column:1/-1"><span class="admin-meta-key">Phone&nbsp;&nbsp;&nbsp;</span><span class="admin-meta-val">${order.phone}</span></div>
            <div class="admin-meta-row" style="grid-column:1/-1"><span class="admin-meta-key">Address&nbsp;</span><span class="admin-meta-val">${order.delivery_address}</span></div>
          </div>
          <div class="admin-items-box">
            <div class="admin-items-label">Items</div>
            ${itemsHtml}
          </div>
          <div class="admin-order-total">
            <span class="admin-total-label">Order Total</span>
            <span class="admin-total-val">₱${parseFloat(order.total_amount).toFixed(2)}</span>
          </div>
        </div>
        <div class="admin-order-footer">
          <select class="admin-status-select" id="status-${order.id}">
            <option value="pending" ${order.status==='pending'?'selected':''}>Pending</option>
            <option value="confirmed" ${order.status==='confirmed'?'selected':''}>Confirmed</option>
            <option value="preparing" ${order.status==='preparing'?'selected':''}>Preparing</option>
            <option value="out_for_delivery" ${order.status==='out_for_delivery'?'selected':''}>Out for Delivery</option>
            <option value="delivered" ${order.status==='delivered'?'selected':''}>Delivered</option>
            <option value="cancelled" ${order.status==='cancelled'?'selected':''}>Cancelled</option>
          </select>
          <button class="admin-update-btn" onclick="updateOrderStatus(${order.id}, this)">Update</button>
        </div>
      </div>`;
    });
    c.innerHTML = html;
  }

  async function updateOrderStatus(orderId, btn) {
    const newStatus = document.getElementById(`status-${orderId}`).value;
    btn.disabled = true;
    try {
      const r = await fetch('admin-api.php?action=update_order_status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: orderId, status: newStatus })
      });
      const d = await r.json();
      if (d.success) { showMessage('Order status updated', 'success'); setTimeout(loadOrders, 1000); }
      else { showMessage('Failed to update order status', 'error'); }
    } catch { showMessage('Error updating order', 'error'); }
    finally { btn.disabled = false; }
  }

  function fmt(s) { return String(s||'').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()); }

  function showMessage(msg, type) {
    const c = document.getElementById('messageContainer');
    c.innerHTML = `<div class="admin-msg admin-msg-${type}">${msg}</div>`;
    setTimeout(() => c.innerHTML = '', 5000);
  }

  function adminLogout() {
    if (confirm('Are you sure you want to logout?'))
      fetch('admin-logout.php', {method:'POST'}).then(() => { window.location.href = 'admin-login.html'; });
  }

  setInterval(() => { if (!document.hidden) loadOrders(); }, 30000);
</script>
</body>
</html>
