<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Profile - Craveh</title>
  <link rel="stylesheet" href="admin-app.css">
  <link rel="icon" href="../assets/images/tabicon1.png" type="image/png">
</head>
<body>

<header class="admin-topnav">
  <a href="admin-dashboard.html" class="admin-logo">
    <div class="admin-logo-icon">
      <img src="../assets/images/craveh(1).png" alt="craveh" style="width:36px;height:36psx;display:block;">    
    </div>
    <span class="admin-logo-name">craveh</span>
    <span class="admin-logo-badge">Admin</span>
  </a>
  <div class="admin-nav-right">
    <span class="admin-nav-welcome" id="adminName"></span>
    <a href="admin-profile.html" class="admin-nav-btn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      Profile
    </a>
    <button onclick="adminLogout()" class="admin-nav-btn logout">Logout</button>
  </div>
</header>

<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-sidebar-section">
      <span class="admin-sidebar-label">Navigation</span>
      <a href="admin-dashboard.html" class="admin-sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="admin-orders.html" class="admin-sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>
        Orders
      </a>
      <a href="admin-menu.html" class="admin-sidebar-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 100 20A10 10 0 0012 2z"/><path d="M12 6v6l4 2"/></svg>
        Menu
      </a>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-page-header">
      <div>
        <h1 class="admin-page-title">My Profile</h1>
        <p class="admin-page-subtitle">Manage your account info and password</p>
      </div>
    </div>

    <div id="messageContainer"></div>

    <div class="admin-profile-wrap" style="margin: 0 auto;">

      <!-- Avatar card -->
      <div class="admin-avatar-card">
        <div class="admin-avatar-circle" id="avatarInitial">?</div>
        <div>
          <div class="admin-avatar-name" id="avatarName">Loading…</div>
          <div class="admin-avatar-email" id="avatarEmail"></div>
        </div>
      </div>

      <!-- Profile information section -->
      <div class="admin-section-card">
        <div class="admin-section-head">
          <div class="admin-section-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          </div>
          <span class="admin-section-title">Profile Information</span>
        </div>
        <div class="admin-section-body">
          <div class="admin-form-group">
            <label class="admin-form-label">Email</label>
            <input class="admin-form-input" type="email" id="email" disabled>
          </div>
          <div class="admin-form-row">
            <div class="admin-form-group">
              <label class="admin-form-label">Full Name</label>
              <input class="admin-form-input" type="text" id="name" placeholder="Your full name">
            </div>
            <div class="admin-form-group">
              <label class="admin-form-label">Phone Number</label>
              <input class="admin-form-input" type="tel" id="phone" placeholder="e.g. 09xxxxxxxxx">
            </div>
          </div>
        </div>
        <div class="admin-section-footer">
          <button class="btn btn-primary" onclick="updateProfile(this)">Save Changes</button>
          <button class="btn btn-secondary" onclick="resetProfileForm()">Reset</button>
        </div>
      </div>

      <!-- Change password section -->
      <div class="admin-section-card">
        <div class="admin-section-head">
          <div class="admin-section-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          </div>
          <span class="admin-section-title">Change Password</span>
        </div>
        <div class="admin-section-body">
          <div class="admin-form-group">
            <label class="admin-form-label">Current Password</label>
            <div class="admin-pw-wrap">
              <input class="admin-form-input" type="password" id="currentPassword" placeholder="Enter current password">
              <button type="button" class="admin-toggle-pw" onclick="togglePw('currentPassword', this)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <div class="admin-form-row">
            <div class="admin-form-group">
              <label class="admin-form-label">New Password</label>
              <div class="admin-pw-wrap">
                <input class="admin-form-input" type="password" id="newPassword" placeholder="Min. 6 characters">
                <button type="button" class="admin-toggle-pw" onclick="togglePw('newPassword', this)">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>
            <div class="admin-form-group">
              <label class="admin-form-label">Confirm New Password</label>
              <div class="admin-pw-wrap">
                <input class="admin-form-input" type="password" id="confirmPassword" placeholder="Repeat new password">
                <button type="button" class="admin-toggle-pw" onclick="togglePw('confirmPassword', this)">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>
          </div>
          <p class="admin-form-hint">Password must be at least 6 characters long.</p>
        </div>
        <div class="admin-section-footer">
          <button class="btn btn-primary" onclick="changePassword(this)">Change Password</button>
          <button class="btn btn-secondary" onclick="resetPasswordForm()">Reset</button>
        </div>
      </div>

    </div><!-- /.admin-profile-wrap -->
  </main>
</div>

<script>
  let currentAdmin = null;
  let profileData = null;

  document.addEventListener('DOMContentLoaded', async () => {
    await loadAdminSession();
    await loadProfile();
  });

  async function loadAdminSession() {
    try {
      const r = await fetch('admin-session.php');
      const d = await r.json();
      if (d.success && d.admin) {
        currentAdmin = d.admin;
        document.getElementById('adminName').textContent = `Hi, ${d.admin.name}`;
      } else { window.location.href = 'admin-login.html'; }
    } catch { window.location.href = 'admin-login.html'; }
  }

  async function loadProfile() {
    try {
      const r = await fetch('admin-profile.php?action=get');
      const d = await r.json();
      if (d.success) {
        profileData = d.admin;
        document.getElementById('email').value = d.admin.email;
        document.getElementById('name').value = d.admin.name || '';
        document.getElementById('phone').value = d.admin.phone || '';
        const initial = (d.admin.name || d.admin.email || '?')[0].toUpperCase();
        document.getElementById('avatarInitial').textContent = initial;
        document.getElementById('avatarName').textContent = d.admin.name || 'Admin';
        document.getElementById('avatarEmail').textContent = d.admin.email;
      } else { showMessage('Failed to load profile', 'error'); }
    } catch { showMessage('Error loading profile', 'error'); }
  }

  async function updateProfile(btn) {
    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    if (!name) { showMessage('Please enter your name', 'error'); return; }
    btn.disabled = true;
    try {
      const r = await fetch('admin-profile.php?action=update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, phone })
      });
      const d = await r.json();
      if (d.success) {
        profileData = d.admin;
        const initial = (name || '?')[0].toUpperCase();
        document.getElementById('avatarInitial').textContent = initial;
        document.getElementById('avatarName').textContent = name;
        showMessage('Profile updated successfully!', 'success');
      } else { showMessage(d.error || 'Failed to update profile', 'error'); }
    } catch { showMessage('Error updating profile', 'error'); }
    finally { btn.disabled = false; }
  }

  function resetProfileForm() {
    if (!profileData) return;
    document.getElementById('name').value = profileData.name || '';
    document.getElementById('phone').value = profileData.phone || '';
  }

  async function changePassword(btn) {
    const currentPassword = document.getElementById('currentPassword').value;
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    if (!currentPassword || !newPassword || !confirmPassword) { showMessage('Please fill in all password fields', 'error'); return; }
    if (newPassword !== confirmPassword) { showMessage('New passwords do not match', 'error'); return; }
    if (newPassword.length < 6) { showMessage('New password must be at least 6 characters', 'error'); return; }
    btn.disabled = true;
    try {
      const r = await fetch('admin-profile.php?action=change_password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ currentPassword, newPassword })
      });
      const d = await r.json();
      if (d.success) { showMessage('Password changed successfully!', 'success'); resetPasswordForm(); }
      else { showMessage(d.error || 'Failed to change password', 'error'); }
    } catch { showMessage('Error changing password', 'error'); }
    finally { btn.disabled = false; }
  }

  function resetPasswordForm() {
    document.getElementById('currentPassword').value = '';
    document.getElementById('newPassword').value = '';
    document.getElementById('confirmPassword').value = '';
  }

  function togglePw(fieldId, btn) {
    const field = document.getElementById(fieldId);
    const isHidden = field.type === 'password';
    field.type = isHidden ? 'text' : 'password';
    btn.querySelector('svg').innerHTML = isHidden
      ? `<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
      : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
  }

  function showMessage(msg, type) {
    const c = document.getElementById('messageContainer');
    c.innerHTML = `<div class="admin-msg admin-msg-${type}">${msg}</div>`;
    setTimeout(() => c.innerHTML = '', 5000);
  }

  function adminLogout() {
    if (confirm('Are you sure you want to logout?')) {
      fetch('admin-logout.php', { method: 'POST' }).then(() => { window.location.href = 'admin-login.html'; });
    }
  }
</script>
</body>
</html>
